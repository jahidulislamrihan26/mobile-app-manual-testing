name: CI

# Checks that the test-suite data is consistent and that every generated file can be built from it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
