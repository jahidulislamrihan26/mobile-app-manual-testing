appId: com.saucelabs.mydemoapp.rn
name: "Use only digits as the full name"
---
- runFlow: ../subflows/start-app.yaml
- runFlow:
    file: ../subflows/add-to-cart.yaml
    env:
      PRODUCT: "Sauce Labs Backpack"
- tapOn: "cart badge"
- runFlow: ../subflows/checkout-to-address.yaml
- tapOn: "Full Name.*input field"
- inputText: "12345"
- hideKeyboard
- tapOn: "Address Line 1.*input field"
- inputText: "12 Analytical Street"
- hideKeyboard
- tapOn: "City.*input field"
- inputText: "London"
- hideKeyboard
- tapOn: "Zip Code.*input field"
- inputText: "N1 9GU"
- hideKeyboard
- tapOn: "Country.*input field"
- inputText: "United Kingdom"
- hideKeyboard
- scrollUntilVisible:
    element: "To Payment.*"
    optional: true
- tapOn:
    text: "To Payment.*"
    optional: true
