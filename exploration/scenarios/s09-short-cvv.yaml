appId: com.saucelabs.mydemoapp.rn
name: "Pay with a 1-digit security code"
---
- runFlow: ../subflows/start-app.yaml
- runFlow:
    file: ../subflows/add-to-cart.yaml
    env:
      PRODUCT: "Sauce Labs Backpack"
- tapOn: "cart badge"
- runFlow: ../subflows/checkout-to-address.yaml
- tapOn: "Full Name.*input field"
- inputText: "Ada Lovelace"
- hideKeyboard
- tapOn: "Address Line 1.*input field"
- inputText: "12 Analytical Street"
- hideKeyboard
- tapOn: "City.*input field"
- inputText: "London"
- hideKeyboard
- tapOn: "Zip Code.*input field"
- inputText: "N1 9GU"
- hideKeyboard
- tapOn: "Country.*input field"
- inputText: "United Kingdom"
- hideKeyboard
- scrollUntilVisible:
    element: "To Payment.*"
    optional: true
- tapOn:
    text: "To Payment.*"
    optional: true
- runFlow:
    file: ../subflows/fill-payment.yaml
    env:
      CARD_NUMBER: "4111111111111111"
      EXPIRY: "1230"
      CVV: "1"
- scrollUntilVisible:
    element: "Review Order.*"
    optional: true
- tapOn:
    text: "Review Order.*"
    optional: true
